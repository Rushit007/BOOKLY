<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Badge Background -->
  <rect width="64" height="64" rx="16" fill="#0C0A09"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Left Open Book Page -->
  <path d="M12 44C18 41 26 41 32 44V20C26 17 18 17 12 20V44Z" 
        fill="url(#pageLeftGrad)" 
        stroke="#F59E0B" 
        stroke-width="1.8" 
        stroke-linejoin="round"/>
  
  <!-- Right Open Book Page -->
  <path d="M52 44C46 41 38 41 32 44V20C38 17 46 17 52 20V44Z" 
        fill="url(#pageRightGrad)" 
        stroke="#F59E0B" 
        stroke-width="1.8" 
        stroke-linejoin="round"/>

  <!-- Page Texture Lines - Left -->
  <path d="M17 25C21 23 26 23 29 25" stroke="#FBBF24" stroke-opacity="0.45" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M17 31C21 29 26 29 29 31" stroke="#FBBF24" stroke-opacity="0.45" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M17 37C21 35 26 35 29 37" stroke="#FBBF24" stroke-opacity="0.45" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Page Texture Lines - Right -->
  <path d="M47 25C43 23 38 23 35 25" stroke="#FBBF24" stroke-opacity="0.45" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M47 31C43 29 38 29 35 31" stroke="#FBBF24" stroke-opacity="0.45" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M47 37C43 35 38 35 35 37" stroke="#FBBF24" stroke-opacity="0.45" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Central Spine Binding -->
  <path d="M32 19V45" stroke="#FED053" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Silk Bookmark Ribbon -->
  <path d="M32 20V48L28 45L24 48V34" fill="#EF4444" stroke="#DC2626" stroke-width="1" stroke-linejoin="round"/>

  <!-- Golden Literary Crest / Spark Above Spine -->
  <path d="M32 9L33.4 13.6L38 15L33.4 16.4L32 21L30.6 16.4L26 15L30.6 13.6L32 9Z" fill="#FED053"/>
  <circle cx="32" cy="15" r="1.2" fill="#FFFFFF"/>

  <!-- Base Folio Stand -->
  <path d="M22 47L32 50L42 47" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>

  <defs>
    <linearGradient id="pageLeftGrad" x1="12" y1="20" x2="32" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#27272A"/>
      <stop offset="1" stop-color="#18181B"/>
    </linearGradient>
    <linearGradient id="pageRightGrad" x1="52" y1="20" x2="32" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3F3F46"/>
      <stop offset="1" stop-color="#18181B"/>
    </linearGradient>
  </defs>
</svg>
